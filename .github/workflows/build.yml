# Автоматическая сборка Glimpsy для Windows, macOS и Linux.
#
# • При каждом push и pull request: тесты + сборка, готовые файлы — во вкладке Actions → Artifacts.
# • При создании тега вида v0.1.0: то же самое + файлы автоматически прикрепляются к Release.
name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы выкладывать файлы в Releases

# Новый push отменяет недоделанную сборку той же ветки — в релиз попадает только свежая версия
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Консоль Windows по умолчанию не понимает кириллицу — включаем UTF-8 для Python
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-14
            mac_arch: arm64
          - name: macOS (Intel)
            os: macos-15-intel
            mac_arch: x86_64
          - name: Linux
            os: ubuntu-22.04   # старая Ubuntu → AppImage запустится на большинстве дистрибутивов

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Номер сборки — внутрь программы: по нему она узнаёт, что вышла новая версия.
      # Ветки claude/… — тестовый канал (релиз «dev»), main и теги — обычный.
      - name: Номер сборки
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/claude/*) channel=dev ;;
            *) channel=stable ;;
          esac
          python scripts/release_info.py build "$GITHUB_RUN_NUMBER" "$channel"

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libfontconfig1 libdbus-1-3 file \
            libpulse0 libpulse-mainloop-glib0

      - name: Python-зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Скачать FFmpeg
        run: python scripts/fetch_ffmpeg.py

      # whisper.cpp для автосубтитров: собираем один раз, дальше берём из кэша
      - name: Кэш whisper.cpp
        uses: actions/cache@v4
        with:
          path: vendor/whisper
          key: whisper-${{ runner.os }}-${{ matrix.mac_arch || 'x64' }}-${{ hashFiles('scripts/build_whisper.py') }}

      - name: Собрать whisper.cpp
        run: python scripts/build_whisper.py

      - name: Тесты
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" python -m pytest -v
          else
            python -m pytest -v
          fi

      # ---------- Windows ----------
      - name: Сборка (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller glimpsy.spec --noconfirm
          7z a -tzip dist/Glimpsy-Windows-x64.zip ./dist/Glimpsy
          GLIMPSY_ONEFILE=1 pyinstaller glimpsy.spec --noconfirm --distpath dist/onefile
          mv dist/onefile/Glimpsy.exe dist/Glimpsy-Windows-x64-portable.exe

      # ---------- macOS ----------
      - name: Сборка (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller glimpsy.spec --noconfirm
          # «Пустая» подпись: без неё macOS на Apple Silicon вообще не запустит программу
          codesign --force --deep --sign - dist/Glimpsy.app
          ditto -c -k --keepParent dist/Glimpsy.app "dist/Glimpsy-macOS-${{ matrix.mac_arch }}.zip"

      # ---------- Linux ----------
      - name: Сборка (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pyinstaller glimpsy.spec --noconfirm
          test -f dist/Glimpsy/_internal/soundcard/pulseaudio.py.h || { echo "В сборке нет файлов soundcard — звука не будет"; exit 1; }
          bash packaging/linux/build_appimage.sh

      - name: Сохранить результат
        uses: actions/upload-artifact@v4
        with:
          name: Glimpsy-${{ runner.os }}-${{ matrix.mac_arch || 'x64' }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

      # Описание версии для автообновления (номер сборки и размеры файлов этой системы)
      - name: Файл версии
        shell: bash
        run: python scripts/release_info.py manifest "$GITHUB_RUN_NUMBER" "${{ runner.os == 'Windows' && 'windows-x64' || runner.os == 'Linux' && 'linux-x64' || format('macos-{0}', matrix.mac_arch) }}"

      # Тестовые сборки (ветки claude/…) — в релиз «dev»: оттуда их берёт автообновление.
      # Сначала файлы программы, потом файл версии — чтобы программа не увидела новую
      # версию раньше, чем её можно скачать.
      - name: Выложить тестовую версию
        if: startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Glimpsy — тестовая версия
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Самая свежая тестовая сборка. Glimpsy обновляется до неё сам (меню значка в трее → «Проверить обновления…»).
            * **Windows** — `Glimpsy-Windows-x64-portable.exe` или `Glimpsy-Windows-x64.zip`
            * **Mac на M1–M4** — `Glimpsy-macOS-arm64.zip`, **Mac на Intel** — `Glimpsy-macOS-x86_64.zip`
            * **Linux** — `Glimpsy-x86_64.AppImage`
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage

      - name: Выложить файл версии
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          overwrite_files: true
          files: dist/version-*.json

      - name: Выложить файл версии (тестовая)
        if: startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/version-*.json

      # Номер версии берём из glimpsy/__init__.py
      - name: Номер версии
        id: ver
        shell: bash
        run: echo "tag=v$(python -c 'import glimpsy; print(glimpsy.__version__)')" >> "$GITHUB_OUTPUT"

      # Релиз создаётся при обновлении main (или при ручном теге vX.Y.Z).
      # Если релиз этой версии уже есть — файлы в нём обновляются.
      - name: Выложить в Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Glimpsy ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          overwrite_files: true
          # одинаковый текст от всех четырёх сборок — чтобы описание не повторялось
          body: |
            Скачайте файл для своей системы:
            * **Windows** — `Glimpsy-Windows-x64-portable.exe` (один файл) или `Glimpsy-Windows-x64.zip`
            * **Mac на M1–M4** — `Glimpsy-macOS-arm64.zip`, **Mac на Intel** — `Glimpsy-macOS-x86_64.zip`
            * **Linux** — `Glimpsy-x86_64.AppImage`

            Подробности — в [README](https://github.com/${{ github.repository }}#readme).
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage

      - name: Выложить файл версии
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          overwrite_files: true
          files: dist/version-*.json
