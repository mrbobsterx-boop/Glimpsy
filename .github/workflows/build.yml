# Автоматическая сборка Worklapse для Windows, macOS и Linux.
#
# • При каждом push и pull request: тесты + сборка, готовые файлы — во вкладке Actions → Artifacts.
# • При создании тега вида v0.1.0: то же самое + файлы автоматически прикрепляются к Release.
name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы выкладывать файлы в Releases

env:
  # Консоль Windows по умолчанию не понимает кириллицу — включаем UTF-8 для Python
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-14
            mac_arch: arm64
          - name: macOS (Intel)
            os: macos-15-intel
            mac_arch: x86_64
          - name: Linux
            os: ubuntu-22.04   # старая Ubuntu → AppImage запустится на большинстве дистрибутивов

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libfontconfig1 libdbus-1-3 file

      - name: Python-зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Скачать FFmpeg
        run: python scripts/fetch_ffmpeg.py

      - name: Тесты
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" python -m pytest -v
          else
            python -m pytest -v
          fi

      # ---------- Windows ----------
      - name: Сборка (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller worklapse.spec --noconfirm
          7z a -tzip dist/Worklapse-Windows-x64.zip ./dist/Worklapse
          WORKLAPSE_ONEFILE=1 pyinstaller worklapse.spec --noconfirm --distpath dist/onefile
          mv dist/onefile/Worklapse.exe dist/Worklapse-Windows-x64-portable.exe

      # ---------- macOS ----------
      - name: Сборка (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller worklapse.spec --noconfirm
          # «Пустая» подпись: без неё macOS на Apple Silicon вообще не запустит программу
          codesign --force --deep --sign - dist/Worklapse.app
          ditto -c -k --keepParent dist/Worklapse.app "dist/Worklapse-macOS-${{ matrix.mac_arch }}.zip"

      # ---------- Linux ----------
      - name: Сборка (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pyinstaller worklapse.spec --noconfirm
          bash packaging/linux/build_appimage.sh

      - name: Сохранить результат
        uses: actions/upload-artifact@v4
        with:
          name: Worklapse-${{ runner.os }}-${{ matrix.mac_arch || 'x64' }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

      - name: Выложить в Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          generate_release_notes: true
